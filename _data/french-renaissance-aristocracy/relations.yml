relations:
  - source-character: diane-de-poitiers
    target-character: catherine-de-medici
    type: rival-of
    description:
      fr: "Diane de Poitiers, favorite d'Henri II, est la grande rivale de Catherine de Médicis à la cour."
      en: "Diane de Poitiers, Henri II's favourite, was Catherine de' Medici's great rival at court."

  - source-character: antoine-de-bourbon
    target-character: jeanne-d-albret
    type: married-to
    description:
      fr: "Antoine de Bourbon épouse Jeanne d'Albret en 1548, devenant roi de Navarre."
      en: "Antoine de Bourbon married Jeanne d'Albret in 1548, becoming King of Navarre."

