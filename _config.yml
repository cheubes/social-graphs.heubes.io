title: "Social Graphs"          # to adjust with the chosen tagline (see "En-tête" in style-guide.md)
description: "Explore the characters of a universe and their relationships as an interactive graph."
url: "https://social-graphs.heubes.io"
baseurl: ""
lang: en                        # fallback value; each page defines its own lang (see data-model.md), which takes precedence in the layout
markdown: kramdown
permalink: pretty                # safety net; in practice, each page has its own explicit permalink (see "Génération des pages")
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - specs/
  - scripts/
  - CLAUDE.md
  - BUILD-PLAN.md
  - README.md
  - Gemfile
  - Gemfile.lock
