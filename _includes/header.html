<header class="sg-header">
  {% assign fr_home = "/fr/" | relative_url %}
  {% assign en_home = "/" | relative_url %}
  {% assign home_url = en_home %}
  {% if lang == "fr" %}{% assign home_url = fr_home %}{% endif %}
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <a href="{{ home_url }}" class="sg-header-brand d-flex align-items-center gap-2 text-decoration-none">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="" class="sg-header-logo">
      <span class="d-flex flex-column">
        <span class="sg-header-title">{{ site.title }}</span>
        {% if page.layout == "home" %}
          <span class="sg-header-tagline">{{ ui["tagline"] }}</span>
        {% endif %}
      </span>
    </a>
    <div class="sg-lang-switcher d-flex flex-column gap-2">
      <a href="{{ fr_home }}" class="sg-lang-flag text-decoration-none" aria-label="Français">🇫🇷</a>
      <a href="{{ en_home }}" class="sg-lang-flag text-decoration-none" aria-label="English">🇬🇧</a>
    </div>
  </div>
</header>
