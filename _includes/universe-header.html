<div class="sg-universe-header d-flex flex-column flex-md-row gap-4 mb-4">
  <img src="{{ cover_src }}"
    class="sg-universe-cover"
    alt="{{ mosaic_page.title }}"
    loading="lazy"
    onerror="this.onerror=null; this.src='{{ placeholder_src }}';">
  <div class="sg-universe-info">
    <h1 class="sg-universe-title mb-1">{{ mosaic_page.title }}</h1>
    <p class="sg-universe-source-type"><small>{{ mosaic_page["source-type"] }}</small></p>
    <div class="sg-universe-description">{{ mosaic_page.content }}</div>
  </div>
</div>
