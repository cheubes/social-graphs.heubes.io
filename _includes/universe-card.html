{% assign universe_slug = universe.path | split: "/" | first %}
{% assign cover_src = "/" | append: universe_slug | append: "/cover.jpg" | relative_url %}
<a href="{{ universe.url | relative_url }}" class="sg-card-link text-decoration-none">
  <div class="card sg-card h-100">
    <img src="{{ cover_src }}"
      class="card-img-top sg-card-img"
      alt="{{ universe.title }}"
      loading="lazy"
      onerror="this.onerror=null; this.src='{{ placeholder_src }}';">
    <div class="card-body">
      <h2 class="card-title h5 sg-card-title">{{ universe.title }}</h2>
      <p class="card-text sg-card-text">{{ universe.content | strip_html | truncate: 150 }}</p>
    </div>
  </div>
</a>
